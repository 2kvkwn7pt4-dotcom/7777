
<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesaje Demo</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #000;
  color: #f5f5f7;
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
}
header {
  padding: 20px;
  display: flex;
  justify-content: space-between;
  color: #aaa;
}
h1 {
  font-size: 36px;
  margin: 22px 20px;
}
.search { margin: 0 16px 12px; }
input {
  width: 100%;
  padding: 13px 16px;
  border: 1px solid #333;
  border-radius: 15px;
  background: #1c1c1e;
  color: white;
  font-size: 16px;
}
#messages { padding: 0 16px; }
.message {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 15px 2px;
  border-bottom: 1px solid #242426;
}
.avatar {
  width: 58px;
  height: 58px;
  flex-shrink: 0;
  border-radius: 50%;
  background: linear-gradient(145deg,#55516f,#29253e);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
  font-weight: 600;
}
.details { flex: 1; min-width: 0; }
.name { font-size: 19px; font-weight: 600; margin-bottom: 5px; }
.preview { color: #929297; font-size: 15px; line-height: 1.4; }
.arrow { color: #777; font-size: 24px; }
footer { text-align: center; color: #777; padding: 25px 10px; }
</style>
</head>
<body>
<header>
  <strong>◷ Mesaje</strong>
  <span>Demo personal</span>
</header>
<h1>Mesaje</h1>
<div class="search">
  <input id="search" type="search" placeholder="⌕  Căutare">
</div>
<main id="messages"></main>
<footer>Interfață demonstrativă · Mesaje fictive</footer>
<script>
const conversations = [
  {name:"Alex",text:"Salut! Ce mai faci?",icon:"A"},
  {name:"Maria",text:"Ne vedem mai târziu 😊",icon:"M"},
  {name:"Familie",text:"Ne auzim diseară.",icon:"F"},
  {name:"Prietenii",text:"A fost super azi 😂",icon:"P"},
  {name:"Andrei",text:"Bine, vorbim mâine!",icon:"A"},
  {name:"Grupul meu",text:"Ați văzut mesajul?",icon:"G"}
];
const list = document.getElementById("messages");
const search = document.getElementById("search");
function renderMessages() {
  const q = search.value.toLowerCase().trim();
  const filtered = conversations.filter(c =>
    c.name.toLowerCase().includes(q) ||
    c.text.toLowerCase().includes(q)
  );
  list.innerHTML = "";
  if (!filtered.length) {
    list.textContent = "Nu s-au găsit conversații.";
    return;
  }
  filtered.forEach(c => {
    const row = document.createElement("div");
    row.className = "message";
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = c.icon;
    const details = document.createElement("div");
    details.className = "details";
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = c.name;
    const preview = document.createElement("div");
    preview.className = "preview";
    preview.textContent = c.text;
    const arrow = document.createElement("span");
    arrow.className = "arrow";
    arrow.textContent = "›";
    details.append(name, preview);
    row.append(avatar, details, arrow);
    list.appendChild(row);
  });
}
search.addEventListener("input", renderMessages);
renderMessages();
</script>
</body>
</html>
